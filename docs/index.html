<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12100e"></head><body><title>Dice &amp; Damage</title>
<meta name="description" content="Exact damage odds, a 3D dice arena, and attack presets for every character in your party.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Cinzel:wght@600;700&display=swap">
<style>/* Layout: wide screens put the dice arena on the left and a glass control
   panel on the right; phones stack a header, the tabs, an arena band sized
   per tab, the scrolling controls and a fixed roll bar. One look per colour
   scheme: every token below is rewritten from the scheme by script. */
:root {
  --bg: #12100e; --panel: #1c1815; --edge: #2e2620; --ink: #f2e7d5; --dim: #a2917a;
  --grid: #2b2420; --accent: #e0a526; --accent2: #c6482b; --bar-lo: #6e4a21; --bar-hi: #f2c14e;
  --miss: #4a3a30; --crit: #ff7a45; --fumble: #8b7964; --sunken: #262019; --on-accent: #12100e;
  --line: color-mix(in srgb, var(--ink) 13%, transparent);
  --line-2: color-mix(in srgb, var(--ink) 22%, transparent);
  --glass: color-mix(in srgb, var(--panel) 82%, transparent);
  --well: color-mix(in srgb, var(--bg) 55%, var(--panel));
  --f-display: "IM Fell English SC", "IM Fell English", Georgia, "Times New Roman", serif;
  --f-italic: "IM Fell English", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-num: "Cinzel", "Trajan Pro", Georgia, serif;
  --panel-w: min(468px, 44vw);
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-size: 16px; line-height: 1.4; overflow: hidden; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- frame */
.app {
  position: fixed; inset: 0; display: grid;
  grid-template-columns: minmax(0, 1fr) var(--panel-w);
  padding-top: env(safe-area-inset-top, 0px);
}
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
#arena { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.stage::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 170px; pointer-events: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 82%, transparent), transparent);
}
.panel {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  border-left: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, var(--bg)), var(--bg));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------------------------------------------------------------- masthead */
.masthead {
  position: absolute; z-index: 2; top: 22px; left: 24px; right: 90px; pointer-events: none;
  text-shadow: 0 2px 18px color-mix(in srgb, var(--bg) 80%, transparent);
}
.eyebrow {
  margin: 0; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent);
}
.masthead h1 {
  margin: .2rem 0 0; font-family: var(--f-display); font-weight: 400; font-size: 2.35rem;
  line-height: 1; letter-spacing: .01em;
}
.masthead .sub { margin: .45rem 0 0; color: var(--dim); font-family: var(--f-italic); font-style: italic; font-size: 1.06rem; }
.masthead .sub b { font-style: normal; font-weight: 400; color: var(--ink); font-family: var(--f-display); }

/* ---------------------------------------------------------------- party rail */
.rail {
  position: absolute; z-index: 3; right: 18px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.rail-btn {
  display: flex; align-items: center; gap: 10px; flex-direction: row-reverse;
  border: 0; background: transparent; padding: 2px; border-radius: 999px; color: var(--dim);
}
.rail-btn .rl {
  font-family: var(--f-display); font-size: 1.02rem; white-space: nowrap; opacity: 0;
  transform: translateX(4px); transition: opacity .2s, transform .2s;
  text-shadow: 0 1px 10px var(--bg), 0 0 2px var(--bg);
}
.rail:hover .rl, .rail:focus-within .rl { opacity: .85; transform: none; }
.rail-btn[aria-current="true"] .rl { opacity: 1; transform: none; color: var(--ink); }
.rail-btn:hover { color: var(--ink); }
.rail-btn .emblem { width: 38px; height: 38px; font-size: 1.05rem; }
.rail-btn[aria-current="true"] .emblem { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent), 0 0 18px -2px var(--accent); }
.rail-more { width: 38px; height: 38px; border-radius: 50%; border: 1px dashed var(--line-2); background: color-mix(in srgb, var(--bg) 60%, transparent); color: var(--dim); display: grid; place-items: center; }
.rail-more svg { width: 18px; height: 18px; }
.rail-more:hover { color: var(--accent); border-color: var(--accent); }

.emblem {
  --c: #7c1d2a;
  flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  font-family: var(--f-display); font-size: 1.3rem; line-height: 1; color: #f6ecd8;
  background:
    radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--c) 55%, #ffffff) 0, transparent 46%),
    radial-gradient(circle at 50% 50%, var(--c), color-mix(in srgb, var(--c) 60%, #000));
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
}
.emblem.light { color: #2a2016; text-shadow: 0 1px 0 rgba(255, 255, 255, .4); }

/* ---------------------------------------------------------------- result */
.result {
  position: absolute; z-index: 2; left: 50%; bottom: 22px; transform: translateX(-50%);
  width: min(560px, calc(100% - 32px)); text-align: center; pointer-events: none;
  text-shadow: 0 2px 16px color-mix(in srgb, var(--bg) 92%, transparent), 0 0 3px var(--bg);
}
.result .expr { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 0; }
.result .verdict { margin: .3rem 0 0; font-family: var(--f-display); font-size: 1.55rem; line-height: 1.05; min-height: 1.6rem; }
.result .total { margin: .1rem 0 0; font-family: var(--f-num); font-weight: 600; font-size: 3.9rem; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.result .total.pop { animation: pop .42s cubic-bezier(.2, .9, .3, 1.35); }
.result .detail { margin: .25rem 0 0; font-family: var(--f-italic); font-style: italic; color: var(--dim); font-size: 1rem; }
.result .recent { margin: .55rem 0 0; font-family: var(--f-mono); font-size: .76rem; color: var(--dim); letter-spacing: .04em; }
.result .recent b { color: var(--ink); font-weight: 500; }
.result .hint { margin: 0; font-family: var(--f-italic); font-style: italic; color: var(--dim); font-size: 1.05rem; }
.result.crit .verdict, .result.crit .total { color: var(--crit); }
.result.fumble .verdict, .result.fumble .total { color: var(--fumble); }
.result.dim .verdict { color: var(--dim); }
@keyframes pop { 0% { transform: scale(.55); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .result .total.pop { animation: none; } }

/* ---------------------------------------------------------------- char bar */
.charbar { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.who {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left;
  border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 3px 12px 3px 3px;
  transition: border-color .2s, background .2s;
}
.who:hover { border-color: var(--line-2); background: color-mix(in srgb, var(--panel) 60%, transparent); }
.who-text { display: flex; flex-direction: column; min-width: 0; }
.who-eyebrow { display: none; }
.who-name { font-family: var(--f-display); font-size: 1.42rem; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-note { font-family: var(--f-italic); font-style: italic; color: var(--dim); font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .chev { margin-left: auto; color: var(--dim); display: grid; }
.who .chev svg { width: 18px; height: 18px; }
.scheme {
  flex: none; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px;
  border: 1px solid var(--line-2); border-radius: 999px; background: color-mix(in srgb, var(--panel) 70%, transparent);
}
.scheme:hover { border-color: var(--accent); }
.scheme i { width: 11px; height: 11px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }

/* ---------------------------------------------------------------- tabs */
.tabs {
  display: flex; gap: 2px; margin: 0 18px 12px; padding: 4px; border: 1px solid var(--line);
  border-radius: 999px; background: color-mix(in srgb, var(--bg) 55%, transparent);
}
.tabs button {
  flex: 1; height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--dim);
  display: grid; place-items: center; transition: background .2s, color .2s;
}
.tabs button svg { width: 22px; height: 22px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* ---------------------------------------------------------------- scroll body */
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px 18px;
  display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: thin; scrollbar-color: var(--edge) transparent;
}
.actions { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 40%, transparent); }

.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--glass); padding: 14px 16px; }
h3.sec {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 10px 0 -2px;
  font-family: var(--f-display); font-weight: 400; font-size: 1.32rem; line-height: 1.1;
}
h3.sec small { font-family: var(--f-italic); font-style: italic; font-size: .9rem; color: var(--dim); }
.lbl {
  display: block; margin: 0 0 6px; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim);
}
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.field { min-width: 0; }

/* steppers */
.stepper {
  display: flex; align-items: stretch; height: 46px; border: 1px solid var(--line-2); border-radius: 12px;
  background: var(--well); overflow: hidden;
}
.stepper button {
  flex: none; width: 46px; border: 0; background: transparent; font-size: 1.35rem; line-height: 1;
  color: var(--accent); touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.stepper button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.stepper button.down { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.stepper button:disabled { color: color-mix(in srgb, var(--dim) 45%, transparent); }
.stepper output, .stepper .mid {
  flex: 1; min-width: 0; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500;
  font-size: 1.08rem; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
}
.stepper .mid { border-top: 0; border-bottom: 0; background: transparent; color: var(--ink); }
.stepper .mid:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.stepper .mid .cyc { font-family: var(--f-body); font-size: .72rem; color: var(--dim); margin-left: 6px; letter-spacing: .02em; }

/* chips */
.chips { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--well); }
.chips button {
  flex: 1; min-width: 0; height: 38px; border: 1px solid transparent; border-radius: 9px; background: transparent;
  color: var(--dim); font-size: .95rem; font-weight: 500; white-space: nowrap; padding: 0 6px;
}
.chips button:hover { color: var(--ink); }
.chips button[aria-checked="true"] { color: var(--ink); background: color-mix(in srgb, var(--accent) 16%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.chips.tall button { height: 38px; }

/* dice rows */
.dice-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.dice-head .lbl { margin: 0; }
.dice-rows { display: flex; flex-direction: column; gap: 6px; }
.dice-row { display: flex; gap: 6px; }
.dice-row .stepper { flex: 1; min-width: 0; }
.icon-btn {
  flex: none; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: transparent;
  color: var(--dim); display: grid; place-items: center;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--line-2); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border: 1px solid var(--line-2);
  border-radius: 999px; background: transparent; color: var(--ink); font-size: .9rem; font-weight: 500; white-space: nowrap;
}
.pill svg { width: 16px; height: 16px; color: var(--accent); }
.pill:hover:not(:disabled) { border-color: var(--accent); }
.pill:disabled { opacity: .45; }
.pill.accent { border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); }

/* toggle button */
.toggle {
  width: 100%; height: 46px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--crit) 55%, transparent);
  background: transparent; color: var(--crit); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.toggle svg { width: 18px; height: 18px; }
.toggle[aria-pressed="true"] { background: var(--crit); color: var(--bg); border-color: var(--crit); }

/* big buttons */
.btn {
  flex: 1; min-width: 0; height: 54px; border-radius: 999px; border: 1px solid transparent; display: inline-flex;
  align-items: center; justify-content: center; gap: 10px; font-size: 1.12rem; font-weight: 700; letter-spacing: .01em;
  transition: filter .15s, transform .1s, background .2s;
}
.btn svg { width: 22px; height: 22px; }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 28px -14px var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.busy { background: color-mix(in srgb, var(--dim) 55%, var(--panel)); color: var(--ink); box-shadow: none; }
.btn.outline { background: transparent; border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); }
.btn.outline:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.btn.critb { background: var(--crit); color: var(--bg); box-shadow: 0 10px 28px -14px var(--crit); }
.btn:disabled { opacity: .45; }
.btn.narrow { flex: 0 0 40%; }

/* preset bar */
.presetbar {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px 11px 16px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--glass);
}
.presetbar:hover { border-color: var(--line-2); }
.presetbar .pb-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.presetbar .pb-name { font-size: 1.08rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.presetbar .pb-name em { font-family: var(--f-italic); font-weight: 400; color: var(--accent2); margin-left: 6px; font-size: .95rem; }
.presetbar .pb-name.unsaved { color: var(--dim); font-weight: 500; }
.presetbar .pb-sum { font-size: .9rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.presetbar .pill { pointer-events: none; }

/* hero: the two numbers that matter, side by side, then how each attack
   splits between crit, hit and miss */
.hero-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.hero .stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hero .stat + .stat { padding-left: 16px; border-left: 1px solid var(--line); }
.hero .eyebrow { color: var(--dim); letter-spacing: .12em; font-size: .68rem; }
.hero .big { font-family: var(--f-num); font-weight: 600; font-size: 2.55rem; line-height: 1.02; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.hero .big.gold { color: var(--accent); }
.hero .stat small { color: var(--dim); font-size: .88rem; line-height: 1.25; }
.hero .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--miss); margin: 14px 0 8px; }
.hero .bar i { display: block; height: 100%; }
.hero-foot { display: flex; justify-content: space-between; gap: 4px 10px; margin: 4px 0 0; flex-wrap: wrap; color: var(--dim); font-size: .88rem; }
.readbox {
  height: 46px; display: grid; place-items: center; border: 1px dashed var(--line-2); border-radius: 12px;
  color: var(--ink); font-size: 1rem; padding: 0 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
@media (max-width: 380px) { .hero .big { font-size: 2.15rem; } .hero .stat + .stat { padding-left: 12px; } }

/* chart */
.chart-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chart-head .chips { flex: 1 1 220px; }
.chart-head .chips button { height: 32px; font-size: .88rem; }
.ccdf { height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--well); color: var(--dim); font-size: .88rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.ccdf svg { width: 15px; height: 15px; }
.ccdf[aria-pressed="true"] { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 55%, transparent); }
.readout { margin: 10px 0 4px; font-size: .9rem; color: var(--dim); min-height: 1.3em; font-variant-numeric: tabular-nums; }
.readout.live { color: var(--ink); }
.plot { display: block; width: 100%; height: 220px; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.plot text { font-family: var(--f-mono); font-size: 10px; fill: var(--dim); }

/* sub switch */
.subs { display: flex; border-bottom: 1px solid var(--line); }
.subs button {
  flex: 1; height: 40px; border: 0; background: transparent; color: var(--dim); font-size: 1rem; font-weight: 500;
  position: relative;
}
.subs button[aria-selected="true"] { color: var(--ink); }
.subs button[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: -1px; width: 88px; height: 2px; transform: translateX(-50%); background: var(--accent); border-radius: 2px; }

.note { margin: 0; color: var(--dim); font-size: .95rem; }
.note em { font-family: var(--f-italic); }
.history { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
.history li { font-family: var(--f-mono); font-size: .9rem; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); }
.history li:first-child { color: var(--ink); border-color: var(--line-2); }

/* ---------------------------------------------------------------- sheets */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.sheet {
  width: min(540px, 100%); max-height: 100%; display: flex; flex-direction: column; border: 1px solid var(--line-2);
  border-radius: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 97%, var(--ink)), var(--panel));
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7); overflow: hidden;
}
.sheet:focus { outline: none; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 18px 10px; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; line-height: 1.05; }
.sheet-head p { margin: 3px 0 0; color: var(--dim); font-size: .92rem; }
.sheet-head .grow { flex: 1; min-width: 0; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 12px; min-height: 0; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px 18px; border-top: 1px solid var(--line); }
.sheet-foot .btn { flex: 1 1 auto; height: 48px; font-size: 1rem; padding: 0 16px; white-space: nowrap; }
.sheet-msg { margin: 0; flex-basis: 100%; color: var(--dim); font-size: .88rem; }
.sheet-msg b { color: var(--ink); font-weight: 500; }

.row {
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 12px; position: relative;
  border: 1px solid transparent;
}
.row + .row { margin-top: 2px; }
.row.active { background: color-mix(in srgb, var(--accent) 9%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.row .main { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; }
.row .main:hover .r-name { color: var(--accent); }
.row .r-text { display: flex; flex-direction: column; min-width: 0; }
.row .r-name { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.active .r-name { color: var(--accent); }
.row .r-sub { color: var(--dim); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r-tag { font-family: var(--f-mono); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.row .acts { display: flex; gap: 4px; flex: none; }
.row .icon-btn { width: 40px; height: 40px; border-color: transparent; }
.row .icon-btn:hover { border-color: var(--line-2); }
.row .danger { width: auto; padding: 0 14px; background: var(--crit); color: var(--bg); border-color: var(--crit); font-weight: 700; }
.row-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 10px 12px 66px; }
.row-tools .pill { height: 34px; }
.row-tools .pill.warn { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 50%, transparent); }
.row-tools .pill.warn svg { color: var(--crit); }
.row-tools .pill.danger-on { background: var(--crit); color: var(--bg); border-color: var(--crit); }
.row-tools .pill.danger-on svg { color: var(--bg); }
.empty { padding: 18px 12px; color: var(--dim); text-align: center; font-family: var(--f-italic); font-style: italic; }

.editor { padding: 12px; margin: 4px 0 10px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 14px; background: var(--well); display: flex; flex-direction: column; gap: 10px; }
.editor .lbl { margin-bottom: 4px; }
.text-in {
  width: 100%; height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--panel); color: var(--ink); font-size: 1.05rem;
}
.text-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.editor-acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.editor-acts .btn { flex: 0 1 auto; height: 42px; padding: 0 18px; font-size: .98rem; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.swatches button[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg) inset; }
.import-card { margin: 4px 0 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--accent2) 50%, transparent); background: color-mix(in srgb, var(--accent2) 8%, var(--panel)); }
.import-card p { margin: 0 0 10px; }
.import-card .err { color: var(--crit); margin: 0; }
.import-card .editor-acts { justify-content: flex-start; }
.drop-hint { display: none; position: fixed; inset: 12px; z-index: 30; border: 2px dashed var(--accent); border-radius: 20px; background: color-mix(in srgb, var(--bg) 70%, transparent); place-items: center; font-family: var(--f-display); font-size: 1.8rem; color: var(--accent); pointer-events: none; }
.drop-hint.on { display: grid; }
.copybox { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: .78rem; border-radius: 10px; border: 1px solid var(--line-2); background: var(--well); color: var(--ink); padding: 10px; }

.toast {
  position: fixed; z-index: 40; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translate(-50%, 12px);
  max-width: calc(100vw - 32px); padding: 9px 16px; border-radius: 999px; border: 1px solid var(--accent);
  background: color-mix(in srgb, var(--panel) 94%, transparent); color: var(--ink); font-size: .95rem;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.kbd { font-family: var(--f-mono); font-size: .7rem; color: var(--dim); text-align: center; margin: 2px 0 0; }
.kbd kbd { font-family: var(--f-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* ---------------------------------------------------------------- phones */
@media (max-width: 699px), (max-aspect-ratio: 1/1) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto var(--stage-h, 0px) minmax(0, 1fr) auto;
    grid-template-areas: "bar" "tabs" "stage" "scroll" "actions";
    transition: grid-template-rows .35s cubic-bezier(.2, .7, .2, 1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel { display: contents; }
  .charbar { grid-area: bar; padding: 10px 14px 8px; }
  .tabs { grid-area: tabs; margin: 0 14px 10px; }
  .stage { grid-area: stage; }
  .scroll { grid-area: scroll; padding: 12px 14px 16px; border-top: 1px solid var(--line); }
  .actions { grid-area: actions; padding: 10px 14px 12px; }
  .masthead, .rail, .kbd { display: none; }
  .stage::after { display: none; }
  .who-eyebrow { display: block; font-family: var(--f-mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .who-name { font-size: 1.22rem; }
  .who-note { display: none; }
  .who .emblem { width: 40px; height: 40px; }
  .app.t0 { --stage-h: 0px; }
  .app.t1 { --stage-h: clamp(210px, 40dvh, 440px); }
  .app.t2 { --stage-h: clamp(200px, 36dvh, 420px); }
  .app.t3 { --stage-h: clamp(240px, 50dvh, 520px); }
  .result {
    left: 14px; right: 14px; bottom: 10px; width: auto; transform: none; text-align: left;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: end;
  }
  .result > * { grid-column: 1; }
  .result .total { grid-column: 2; grid-row: 1 / span 3; align-self: center; font-size: 3rem; }
  .result .verdict { font-size: 1.3rem; min-height: 1.35rem; margin-top: .15rem; }
  .result .recent { grid-column: 1 / -1; margin-top: .3rem; }
  .result .hint { grid-column: 1 / -1; }
  .sheet-wrap { padding: 0; place-items: end stretch; }
  .sheet { width: 100%; max-height: 92dvh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
}
@media (max-width: 699px), (max-aspect-ratio: 1/1) {
  @media (max-height: 700px) {
    .app.t1 { --stage-h: clamp(190px, 36dvh, 440px); }
    .app.t2 { --stage-h: clamp(180px, 32dvh, 420px); }
    .result .total { font-size: 2.7rem; }
  }
}
@media (max-height: 640px) and (min-aspect-ratio: 1/1) and (min-width: 700px) {
  .masthead h1 { font-size: 1.7rem; }
  .masthead .sub { display: none; }
  .result .total { font-size: 3rem; }
  .charbar { padding-top: 10px; }
}
@media (max-width: 380px) {
  .chips button { font-size: .86rem; padding: 0 3px; }
  .btn { font-size: 1rem; }
}
